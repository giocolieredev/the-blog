---
layout: default
---
<main class="wrap">
  <article class="post">
    <header class="post-header">
      <h1 class="post-title">{{ page.title }}</h1>
      <div class="post-meta">
        <time datetime="{{ page.date | date: '%Y-%m-%d' }}">{{ page.date | date: '%B %-d, %Y' }}</time>
        {% if page.tags %}
        <span class="post-tags">
          {% for tag in page.tags %}<span class="tag">{{ tag }}</span>{% endfor %}
        </span>
        {% endif %}
      </div>
    </header>
    <div class="post-content">
      {{ content }}
    </div>
  </article>
  <p class="post-back"><a href="{{ '/' | relative_url }}">← Back to all posts</a></p>
</main>
