---
layout: default
---
<main class="wrap">
  <article class="post">
    <header class="post-header">
      <h1 class="post-title">{{ page.title }}</h1>
      <div class="post-meta">
        <time datetime="{{ page.date | date: '%Y-%m-%d' }}">{{ page.date | date: '%B %-d, %Y' }}</time>
        {% if page.tags %}
        <span class="post-tags">
          {% for tag in page.tags %}<span class="tag">{{ tag }}</span>{% endfor %}
        </span>
        {% endif %}
      </div>
    </header>
    <div class="post-content">
      {{ content }}
    </div>
  </article>

  <div class="share-bar">
    <span class="share-label">SHARE</span>
    <a class="share-link" href="https://twitter.com/intent/tweet?text={{ page.title | url_encode }}&url={{ page.url | absolute_url | url_encode }}" target="_blank" rel="noopener" title="Share on X / Twitter" aria-label="Share on X / Twitter"><i class="fa-brands fa-x-twitter"></i></a>
    <a class="share-link" href="https://bsky.app/intent/compose?text={{ page.title | url_encode }}%20{{ page.url | absolute_url | url_encode }}" target="_blank" rel="noopener" title="Share on Bluesky" aria-label="Share on Bluesky"><i class="fa-brands fa-bluesky"></i></a>
    <a class="share-link" href="https://www.reddit.com/submit?url={{ page.url | absolute_url | url_encode }}&title={{ page.title | url_encode }}" target="_blank" rel="noopener" title="Share on Reddit" aria-label="Share on Reddit"><i class="fa-brands fa-reddit-alien"></i></a>
    <a class="share-link" href="https://mastodon.social/share?text={{ page.title | url_encode }}%20{{ page.url | absolute_url | url_encode }}" target="_blank" rel="noopener" title="Share on the Fediverse (Mastodon)" aria-label="Share on the Fediverse (Mastodon)"><i class="fa-brands fa-mastodon"></i></a>
    <a class="share-link" href="https://www.threads.net/intent/post?text={{ page.title | url_encode }}%20{{ page.url | absolute_url | url_encode }}" target="_blank" rel="noopener" title="Share on Threads" aria-label="Share on Threads"><i class="fa-brands fa-threads"></i></a>
    <a class="share-link" href="https://wa.me/?text={{ page.title | url_encode }}%20{{ page.url | absolute_url | url_encode }}" target="_blank" rel="noopener" title="Share on WhatsApp" aria-label="Share on WhatsApp"><i class="fa-brands fa-whatsapp"></i></a>
    <a class="share-link" href="https://t.me/share/url?url={{ page.url | absolute_url | url_encode }}&text={{ page.title | url_encode }}" target="_blank" rel="noopener" title="Share on Telegram" aria-label="Share on Telegram"><i class="fa-brands fa-telegram"></i></a>
    <a class="share-link" href="https://www.linkedin.com/sharing/share-offsite/?url={{ page.url | absolute_url | url_encode }}" target="_blank" rel="noopener" title="Share on LinkedIn" aria-label="Share on LinkedIn"><i class="fa-brands fa-linkedin-in"></i></a>
    <a class="share-link" href="mailto:?subject={{ page.title | url_encode }}&body={{ page.url | absolute_url | url_encode }}" title="Share by email" aria-label="Share by email"><i class="fa-solid fa-envelope"></i></a>
    <button type="button" class="share-link" id="qr-toggle" aria-expanded="false" aria-controls="share-qr" title="Show QR code" aria-label="Show QR code"><i class="fa-solid fa-qrcode"></i></button>
  </div>

  <div class="share-qr" id="share-qr" hidden>
    <div id="qr-code"></div>
    <p class="share-qr-note">Scan with your phone to open this post</p>
  </div>

  <p class="post-back"><a href="{{ '/' | relative_url }}">← Back to all posts</a></p>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
  /* QR code for this post — generated on demand from the current URL */
  (function () {
    var btn = document.getElementById('qr-toggle');
    var box = document.getElementById('share-qr');
    var made = false;
    if (!btn || !box) return;
    btn.addEventListener('click', function () {
      if (!made) {
        new QRCode(document.getElementById('qr-code'), {
          text: window.location.href,
          width: 180,
          height: 180,
          correctLevel: QRCode.CorrectLevel.M
        });
        made = true;
      }
      var show = box.hidden;
      box.hidden = !show;
      btn.setAttribute('aria-expanded', show ? 'true' : 'false');
    });
  })();
</script>
